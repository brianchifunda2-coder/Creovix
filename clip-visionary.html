<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clip Visionary - CREOVIX</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
    }

    header {
      background: #000;
      padding: 18px 20px;
      border-bottom: 1px solid #222;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 6px;
    }

    nav a:hover {
      background: #222;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 30px 18px;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
    }

    .login-status {
      margin-top: 15px;
      font-weight: bold;
    }

    .upload-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 40px;
    }

    .upload-card h3 {
      margin-top: 0;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 14px;
      background: #080808;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
    }

    input[type="file"] {
      padding: 10px;
    }

    button,
    .download-btn {
      display: inline-block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover,
    .download-btn:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #123d1c;
      color: #8cff9a;
    }

    .error {
      display: block;
      background: #421515;
      color: #ff8c8c;
    }

    .library-title {
      margin-bottom: 20px;
    }

    .clips-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .clip-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
    }

    /* VIDEO PLAYER */
    .clip-video {
      width: 100%;
      height: auto;
      min-height: 220px;
      max-height: 500px;
      display: block;
      background: #000;
      object-fit: contain;
    }

    .video-label {
      padding: 10px 15px;
      background: #080808;
      color: #aaa;
      font-size: 13px;
    }

    .clip-info {
      padding: 16px;
    }

    .clip-info h3 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .clip-info p {
      color: #bbb;
      margin: 7px 0;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      background: #111;
      border-radius: 14px;
      color: #aaa;
    }

    .login-warning {
      color: #ffcc66;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 35px 15px;
    }

    @media (max-width: 600px) {
      main {
        padding: 22px 12px;
      }

      .hero h2 {
        font-size: 27px;
      }

      nav {
        gap: 3px;
      }

      nav a {
        font-size: 14px;
      }

      .clip-video {
        min-height: 200px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>CREOVIX</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="script-creator.html">Scripts</a>
    <a href="speech-writer.html">Speeches</a>
    <a href="short-clips.html">Short Clips</a>
    <a href="movie-editing.html">Movie Editing</a>
    <a href="clip-visionary.html">Clip Visionary</a>
  </nav>
</header>


<main>

  <section class="hero">

    <h2>🎬 Clip Visionary</h2>

    <p>
      Upload, discover and download free editing clips on CREOVIX.
    </p>

    <div
      class="login-status"
      id="loginStatus"
    >
      Checking login...
    </div>

  </section>


  <section class="upload-card">

    <h3>📤 Upload a Clip</h3>

    <input
      type="text"
      id="clipTitle"
      placeholder="Clip title"
    >

    <select id="clipCategory">

      <option value="">
        Select category
      </option>

      <option value="Music">
        Music
      </option>

      <option value="Cinematic">
        Cinematic
      </option>

      <option value="Action">
        Action
      </option>

      <option value="Love">
        Love
      </option>

      <option value="Nature">
        Nature
      </option>

      <option value="Travel">
        Travel
      </option>

      <option value="Sports">
        Sports
      </option>

      <option value="Funny">
        Funny
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <input
      type="text"
      id="creatorName"
      placeholder="Creator name"
    >


    <input
      type="file"
      id="clipFile"
      accept="video/*"
    >


    <button id="uploadButton">
      📤 Upload Clip
    </button>


    <div
      id="status"
      class="status"
    ></div>


    <div
      id="loginWarning"
      class="login-warning"
    ></div>

  </section>


  <section>

    <h2 class="library-title">
      🔥 Clip Library
    </h2>


    <div
      id="clipsContainer"
      class="clips-container"
    >

      <div class="empty">
        Loading clips...
      </div>

    </div>

  </section>

</main>


<footer>
  © 2026 CREOVIX. All rights reserved.
</footer>


<script>

  const SUPABASE_URL =
    "https://sxdfwbvjohzgfaatqxqk.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_Izxu9zWrYhf3rqEUDxInVQ_1qdGoJdQ";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;


  const loginStatus =
    document.getElementById("loginStatus");


  const loginWarning =
    document.getElementById("loginWarning");


  const uploadButton =
    document.getElementById("uploadButton");


  const status =
    document.getElementById("status");


  const clipsContainer =
    document.getElementById("clipsContainer");


  function showStatus(message, type) {

    status.textContent = message;

    status.className =
      type
        ? "status " + type
        : "status";

  }


  async function checkLogin() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      loginStatus.textContent =
        "❌ Unable to check login.";

      uploadButton.disabled = true;

      return;

    }


    currentUser =
      data.session
        ? data.session.user
        : null;


    if (currentUser) {

      const creator =
        currentUser.user_metadata?.creator_name ||
        currentUser.email?.split("@")[0] ||
        "CREOVIX Creator";


      loginStatus.innerHTML =
        "✓ Logged in as <strong>" +
        escapeHtml(creator) +
        "</strong>";


      document.getElementById(
        "creatorName"
      ).value = creator;


      loginWarning.textContent = "";

      uploadButton.disabled = false;

    } else {

      loginStatus.textContent =
        "⚠️ You are not logged in.";


      loginWarning.innerHTML =
        'Please <a href="login.html" style="color:white;">log in</a> to upload clips.';


      uploadButton.disabled = true;

    }

  }


  async function uploadClip() {

    if (!currentUser) {

      showStatus(
        "❌ Please log in before uploading.",
        "error"
      );

      return;

    }


    const title =
      document
        .getElementById("clipTitle")
        .value
        .trim();


    const category =
      document.getElementById(
        "clipCategory"
      ).value;


    const creator =
      document
        .getElementById("creatorName")
        .value
        .trim();


    const file =
      document
        .getElementById("clipFile")
        .files[0];


    if (!title) {

      showStatus(
        "❌ Please enter a clip title.",
        "error"
      );

      return;

    }


    if (!file) {

      showStatus(
        "❌ Please choose a video file.",
        "error"
      );

      return;

    }


    if (!file.type.startsWith("video/")) {

      showStatus(
        "❌ Please select a video file.",
        "error"
      );

      return;

    }


    const maxSize =
      100 * 1024 * 1024;


    if (file.size > maxSize) {

      showStatus(
        "❌ Video must be smaller than 100 MB.",
        "error"
      );

      return;

    }


    uploadButton.disabled = true;


    showStatus(
      "⏳ Uploading your clip...",
      ""
    );


    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "-"
        );


    const filePath =
      currentUser.id +
      "/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 12) +
      "-" +
      safeName;


    const {
      error: uploadError
    } =
      await supabaseClient.storage
        .from("Clips")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );


    if (uploadError) {

      showStatus(
        "❌ Storage upload failed: " +
        uploadError.message,
        "error"
      );

      uploadButton.disabled = false;

      return;

    }


    const {
      error: dbError
    } =
      await supabaseClient
        .from("clips")
        .insert({

          title: title,

          category:
            category || "General",

          creator_name:
            creator || "CREOVIX Creator",

          file_path:
            filePath

        });


    if (dbError) {

      await supabaseClient.storage
        .from("Clips")
        .remove([
          filePath
        ]);


      showStatus(
        "❌ Database save failed: " +
        dbError.message,
        "error"
      );

      uploadButton.disabled = false;

      return;

    }


    showStatus(
      "✅ Clip uploaded successfully!",
      "success"
    );


    document.getElementById(
      "clipTitle"
    ).value = "";


    document.getElementById(
      "clipCategory"
    ).value = "";


    document.getElementById(
      "clipFile"
    ).value = "";


    uploadButton.disabled = false;


    await loadClips();

  }


  async function loadClips() {

    clipsContainer.innerHTML =
      '<div class="empty">Loading clips...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("clips")
        .select(
          "id, title, category, creator_name, file_path, created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      clipsContainer.innerHTML =
        '<div class="empty">' +
        '❌ Unable to load clips.<br><br>' +
        escapeHtml(error.message) +
        '</div>';

      return;

    }


    if (!data || data.length === 0) {

      clipsContainer.innerHTML =
        '<div class="empty">' +
        '🎬 No clips yet<br><br>' +
        'Be the first creator to upload a clip.' +
        '</div>';

      return;

    }


    clipsContainer.innerHTML = "";


    data.forEach(function(clip) {

      const {
        data: publicData
      } =
        supabaseClient.storage
          .from("Clips")
          .getPublicUrl(
            clip.file_path
          );


      const videoUrl =
        publicData.publicUrl;


      const card =
        document.createElement("div");


      card.className =
        "clip-card";


      card.innerHTML = `

        <video
          class="clip-video"
          controls
          playsinline
          preload="metadata"
          src="${videoUrl}"
        >
          Your browser does not support
          video playback.
        </video>

        <div class="video-label">
          ▶️ Watch this clip on CREOVIX
        </div>

        <div class="clip-info">

          <h3>
            🎥 ${escapeHtml(clip.title)}
          </h3>

          <p>
            <strong>Category:</strong>
            ${escapeHtml(
              clip.category || "General"
            )}
          </p>

          <p>
            <strong>Creator:</strong>
            ${escapeHtml(
              clip.creator_name ||
              "CREOVIX Creator"
            )}
          </p>

          <a
            class="download-btn"
            href="${videoUrl}"
            download
            target="_blank"
          >
            ⬇️ Download Clip
          </a>

        </div>

      `;


      clipsContainer.appendChild(card);

    });

  }


  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  uploadButton.addEventListener(
    "click",
    uploadClip
  );


  checkLogin();

  loadClips();

</script>

</body>
</html>
