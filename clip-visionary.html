<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clip Visionary - CREOVIX</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
    }

    header {
      background: #000;
      padding: 18px 20px;
      border-bottom: 1px solid #222;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 6px;
      background: #111;
    }

    nav a:hover {
      background: #222;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .hero {
      text-align: center;
      margin-bottom: 25px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
    }

    .login-status {
      background: #101010;
      border: 1px solid #222;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .box {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .box h3 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 7px;
      border: 1px solid #333;
      font-size: 15px;
    }

    input,
    select {
      background: #111;
      color: white;
    }

    button {
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .message {
      margin-top: 12px;
      color: #aaa;
    }

    .search-area {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 10px;
      margin-bottom: 20px;
    }

    .clips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .clip-card {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
    }

    .clip-video {
      width: 100%;
      display: block;
      background: black;
      max-height: 400px;
    }

    .clip-info {
      padding: 15px;
    }

    .clip-info h3 {
      margin-top: 0;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .clip-info p {
      color: #aaa;
      margin: 7px 0;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      background: #181818;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 13px;
      color: #ddd;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button,
    .actions a {
      width: 100%;
      padding: 11px;
      border-radius: 7px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #333;
    }

    .watch-btn {
      background: #151515;
      color: white;
    }

    .download-btn {
      background: white;
      color: black;
    }

    .like-btn {
      background: #151515;
      color: white;
    }

    .like-btn.liked {
      background: #251010;
      color: #ff7070;
      border-color: #633;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 40px 10px;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 30px 10px;
      border-top: 1px solid #222;
    }

    @media (max-width: 650px) {
      .search-area {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .hero h2 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 CREOVIX</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="script-creator.html">Scripts</a>
    <a href="speech-writer.html">Speeches</a>
    <a href="short-clips.html">Short Clips</a>
    <a href="movie-editing.html">Movie Editing</a>
    <a href="clip-visionary.html">Clip Visionary</a>
  </nav>
</header>

<main>

  <section class="hero">
    <h2>🎬 Clip Visionary</h2>
    <p>Upload, discover and download free editing clips on CREOVIX.</p>
  </section>

  <div class="login-status" id="loginStatus">
    Checking login...
  </div>

  <section class="box">
    <h3>📤 Upload a Clip</h3>

    <input
      type="text"
      id="clipTitle"
      placeholder="Clip title"
    >

    <select id="clipCategory">
      <option value="">Select category</option>
      <option value="Music">Music</option>
      <option value="Cinematic">Cinematic</option>
      <option value="Action">Action</option>
      <option value="Love">Love</option>
      <option value="Nature">Nature</option>
      <option value="Travel">Travel</option>
      <option value="Sports">Sports</option>
      <option value="Funny">Funny</option>
      <option value="Other">Other</option>
    </select>

    <input
      type="file"
      id="clipFile"
      accept="video/*"
    >

    <button id="uploadButton" onclick="uploadClip()">
      📤 Upload Clip
    </button>

    <div class="message" id="uploadMessage"></div>
  </section>

  <section class="box">
    <h2>🔥 Clip Library</h2>

    <div class="search-area">

      <input
        type="search"
        id="searchInput"
        placeholder="Search clips..."
        oninput="renderClips()"
      >

      <select
        id="categoryFilter"
        onchange="renderClips()"
      >
        <option value="All">All Categories</option>
        <option value="Music">Music</option>
        <option value="Cinematic">Cinematic</option>
        <option value="Action">Action</option>
        <option value="Love">Love</option>
        <option value="Nature">Nature</option>
        <option value="Travel">Travel</option>
        <option value="Sports">Sports</option>
        <option value="Funny">Funny</option>
        <option value="Other">Other</option>
      </select>

    </div>

    <div id="clips" class="clips"></div>
  </section>

</main>

<footer>
  © 2026 CREOVIX. All rights reserved.
</footer>

<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://sxdfwbvjohzgfaatqxqk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Izxu9zWrYhf3rqEUDxInVQ_1qdGoJdQ";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     GLOBAL VARIABLES
  ========================================= */

  let currentUser = null;
  let allClips = [];
  let likedClipIds = new Set();


  /* =========================================
     CHECK LOGIN
  ========================================= */

  async function checkLogin() {

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      console.error(error);
      return;
    }

    currentUser = data.session
      ? data.session.user
      : null;

    const status =
      document.getElementById("loginStatus");

    if (currentUser) {

      const creatorName =
        currentUser.user_metadata?.creator_name ||
        currentUser.email ||
        "Creator";

      status.innerHTML =
        "✓ Logged in as <strong>" +
        escapeHtml(creatorName) +
        "</strong>";

      await loadUserLikes();

    } else {

      status.innerHTML =
        '⚠️ You are not logged in. <a href="login.html" style="color:white;">Log in</a> to upload and like clips.';

    }

    await loadClips();
  }


  /* =========================================
     LOAD USER LIKES
  ========================================= */

  async function loadUserLikes() {

    if (!currentUser) {
      likedClipIds = new Set();
      return;
    }

    const {
      data,
      error
    } = await supabaseClient
      .from("clip_likes")
      .select("clip_id")
      .eq("user_id", currentUser.id);

    if (error) {

      console.error(
        "Unable to load likes:",
        error.message
      );

      likedClipIds = new Set();
      return;
    }

    likedClipIds =
      new Set(
        (data || []).map(
          item => item.clip_id
        )
      );
  }


  /* =========================================
     LOAD CLIPS
  ========================================= */

  async function loadClips() {

    const {
      data,
      error
    } = await supabaseClient
      .from("clips")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      document.getElementById("clips").innerHTML =
        '<div class="empty">Unable to load clips.</div>';

      return;
    }

    allClips = data || [];

    renderClips();
  }


  /* =========================================
     RENDER CLIPS
  ========================================= */

  function renderClips() {

    const container =
      document.getElementById("clips");

    const search =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const category =
      document
        .getElementById("categoryFilter")
        .value;

    const filtered =
      allClips.filter(clip => {

        const title =
          (clip.title || "").toLowerCase();

        const creator =
          (clip.creator_name || "").toLowerCase();

        const clipCategory =
          clip.category || "";

        const matchesSearch =
          !search ||
          title.includes(search) ||
          creator.includes(search);

        const matchesCategory =
          category === "All" ||
          clipCategory === category;

        return (
          matchesSearch &&
          matchesCategory
        );
      });


    if (filtered.length === 0) {

      container.innerHTML =
        '<div class="empty">No clips found.</div>';

      return;
    }


    container.innerHTML =
      filtered.map(clip => {

        const alreadyLiked =
          likedClipIds.has(clip.id);

        const videoUrl =
          getClipUrl(clip.file_path);

        const creator =
          escapeHtml(
            clip.creator_name ||
            "CREOVIX Creator"
          );

        const title =
          escapeHtml(
            clip.title ||
            "Untitled Clip"
          );

        const category =
          escapeHtml(
            clip.category ||
            "Other"
          );

        const views =
          Number(clip.views || 0);

        const likes =
          Number(clip.likes || 0);


        return `
          <article class="clip-card">

            <video
              class="clip-video"
              controls
              preload="metadata"
              playsinline
              onclick="addView('${clip.id}', this)"
            >
              <source
                src="${videoUrl}"
                type="video/mp4"
              >
              Your browser does not support video playback.
            </video>

            <div class="clip-info">

              <h3>🎥 ${title}</h3>

              <p>
                <strong>Category:</strong>
                ${category}
              </p>

              <p>
                <strong>Creator:</strong>
                ${creator}
              </p>

              <div class="stats">

                <span class="stat">
                  👁️ ${views} views
                </span>

                <span class="stat">
                  ❤️ ${likes} likes
                </span>

              </div>

              <div class="actions">

                <button
                  class="watch-btn"
                  onclick="watchClip('${videoUrl}')"
                >
                  ▶️ Watch this clip on CREOVIX
                </button>

                <button
                  class="like-btn ${alreadyLiked ? "liked" : ""}"
                  ${alreadyLiked ? "disabled" : ""}
                  onclick="likeClip('${clip.id}', this)"
                >
                  ${alreadyLiked ? "❤️ Liked" : "❤️ " + likes + " likes"}
                </button>

                <a
                  class="download-btn"
                  href="${videoUrl}"
                  download
                  target="_blank"
                >
                  ⬇️ Download Clip
                </a>

              </div>

            </div>

          </article>
        `;

      }).join("");
  }


  /* =========================================
     SECURE VIEW COUNTER
  ========================================= */

  async function addView(clipId, videoElement) {

    if (
      videoElement.dataset.viewCounted === "true"
    ) {
      return;
    }

    videoElement.dataset.viewCounted = "true";

    const {
      error
    } = await supabaseClient.rpc(
      "increment_clip_view",
      {
        p_clip_id: clipId
      }
    );

    if (error) {

      console.error(
        "View counter error:",
        error.message
      );

      return;
    }

    const clip =
      allClips.find(
        item => item.id === clipId
      );

    if (clip) {
      clip.views =
        Number(clip.views || 0) + 1;

      renderClips();
    }
  }


  /* =========================================
     SECURE LIKE
  ========================================= */

  async function likeClip(
    clipId,
    button
  ) {

    if (!currentUser) {

      alert(
        "Please log in to like clips."
      );

      return;
    }


    if (likedClipIds.has(clipId)) {

      button.disabled = true;
      button.textContent = "❤️ Liked";

      return;
    }


    button.disabled = true;
    button.textContent = "❤️ Saving...";


    const {
      error
    } = await supabaseClient.rpc(
      "add_clip_like",
      {
        p_clip_id: clipId
      }
    );


    if (error) {

      console.error(
        "Like error:",
        error.message
      );

      alert(
        "Unable to like this clip: " +
        error.message
      );

      button.disabled = false;

      const clip =
        allClips.find(
          item => item.id === clipId
        );

      button.textContent =
        "❤️ " +
        Number(clip?.likes || 0) +
        " likes";

      return;
    }


    likedClipIds.add(clipId);


    const clip =
      allClips.find(
        item => item.id === clipId
      );


    if (clip) {

      clip.likes =
        Number(clip.likes || 0) + 1;

    }


    button.classList.add("liked");
    button.textContent = "❤️ Liked";
    button.disabled = true;


    renderClips();
  }


  /* =========================================
     UPLOAD CLIP
  ========================================= */

  async function uploadClip() {

    if (!currentUser) {

      alert(
        "Please log in before uploading a clip."
      );

      window.location.href =
        "login.html";

      return;
    }


    const title =
      document
        .getElementById("clipTitle")
        .value
        .trim();

    const category =
      document
        .getElementById("clipCategory")
        .value;

    const file =
      document
        .getElementById("clipFile")
        .files[0];

    const button =
      document.getElementById(
        "uploadButton"
      );

    const message =
      document.getElementById(
        "uploadMessage"
      );


    if (!title) {

      alert(
        "Please enter a clip title."
      );

      return;
    }


    if (!category) {

      alert(
        "Please select a category."
      );

      return;
    }


    if (!file) {

      alert(
        "Please select a video file."
      );

      return;
    }


    if (!file.type.startsWith("video/")) {

      alert(
        "Please select a valid video file."
      );

      return;
    }


    const maxSize =
      50 * 1024 * 1024;


    if (file.size > maxSize) {

      alert(
        "The video is larger than 50 MB."
      );

      return;
    }


    button.disabled = true;
    button.textContent =
      "Uploading...";


    message.textContent =
      "Uploading your clip...";


    try {

      const safeName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

      const filePath =
        currentUser.id +
        "/" +
        Date.now() +
        "-" +
        safeName;


      const {
        error: uploadError
      } = await supabaseClient
        .storage
        .from("Clips")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );


      if (uploadError) {
        throw uploadError;
      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("Clips")
          .getPublicUrl(
            filePath
          );


      const creatorName =
        currentUser
          .user_metadata
          ?.creator_name ||
        currentUser.email ||
        "CREOVIX Creator";


      const {
        error: dbError
      } = await supabaseClient
        .from("clips")
        .insert({
          title: title,
          category: category,
          creator_name: creatorName,
          file_path: filePath,
          views: 0,
          likes: 0
        });


      if (dbError) {

        await supabaseClient
          .storage
          .from("Clips")
          .remove([filePath]);

        throw dbError;
      }


      message.textContent =
        "✓ Clip uploaded successfully!";


      document
        .getElementById("clipTitle")
        .value = "";

      document
        .getElementById("clipCategory")
        .value = "";

      document
        .getElementById("clipFile")
        .value = "";


      await loadClips();

    } catch (error) {

      console.error(error);

      message.textContent =
        "Upload failed: " +
        error.message;

    } finally {

      button.disabled = false;
      button.textContent =
        "📤 Upload Clip";
    }
  }


  /* =========================================
     WATCH CLIP
  ========================================= */

  function watchClip(url) {

    window.open(
      url,
      "_blank"
    );
  }


  /* =========================================
     STORAGE URL
  ========================================= */

  function getClipUrl(filePath) {

    const {
      data
    } =
      supabaseClient
        .storage
        .from("Clips")
        .getPublicUrl(
          filePath
        );

    return data.publicUrl;
  }


  /* =========================================
     HTML ESCAPE
  ========================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================
     START
  ========================================= */

  checkLogin();


  /* =========================================
     AUTH STATE CHANGES
  ========================================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      currentUser =
        session
          ? session.user
          : null;

      await checkLogin();
    }
  );

</script>

</body>
</html>
