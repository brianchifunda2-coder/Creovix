<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clip Visionary - J Extra</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .clip-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
      margin-top: 25px;
      text-align: left;
    }

    .clip-card video {
      width: 100%;
      max-height: 400px;
      border-radius: 10px;
      background: #000;
      margin: 15px 0;
    }

    .clip-info h3 {
      margin-bottom: 8px;
    }

    .clip-info p {
      color: #aaa;
      margin-bottom: 10px;
    }

    .upload-box {
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 25px;
      margin-top: 20px;
    }

    .upload-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #00a86b;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header class="top-bar">

  <div class="logo">J EXTRA</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="script-creator.html">Scripts</a>
    <a href="speech-writer.html">Speeches</a>
    <a href="short-clips.html">Short Clips</a>
    <a href="movie-editing.html">Movie Editing</a>
    <a href="clip-visionary.html">Clip Visionary</a>
  </nav>

</header>


<section class="section">

  <h2>🎬 Clip Visionary</h2>

  <p>
    Upload, discover and download free editing clips.
  </p>


  <!-- UPLOAD -->

  <div class="card">

    <h3>📤 Upload a Clip</h3>

    <div class="upload-box">

      <input
        id="clipTitle"
        type="text"
        placeholder="Clip title"
      >

      <input
        id="clipCategory"
        type="text"
        placeholder="Category e.g. Cinematic, Action, Comedy"
      >

      <input
        id="creatorName"
        type="text"
        placeholder="Your creator name"
      >

      <input
        id="clipFile"
        type="file"
        accept="video/*"
      >

      <button onclick="uploadClip()">
        📤 Upload Clip
      </button>

      <p id="status" class="status"></p>

    </div>

  </div>


  <!-- CLIP LIBRARY -->

  <div class="card">

    <h3>🔥 Clip Library</h3>

    <div id="clipsContainer">

      <p class="status">
        Loading clips...
      </p>

    </div>

  </div>

</section>


<footer>

  <p>
    © 2026 J Extra Creator Hub.
    All rights reserved.
  </p>

</footer>


<script>

/* =========================================
   SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL =
  "https://sxdfwbvjohzgfaatqxqk.supabase.co";

/*
   IMPORTANT:
   Replace the text below with your
   sb_publishable_... key.
   
   DO NOT use your sb_secret_... key.
*/

const SUPABASE_KEY =
  "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   UPLOAD CLIP
   ========================================= */

async function uploadClip() {

  const title =
    document.getElementById("clipTitle").value.trim();

  const category =
    document.getElementById("clipCategory").value.trim();

  const creator =
    document.getElementById("creatorName").value.trim();

  const fileInput =
    document.getElementById("clipFile");

  const file =
    fileInput.files[0];

  const status =
    document.getElementById("status");


  if (!title) {

    status.textContent =
      "Please enter a clip title.";

    return;
  }


  if (!file) {

    status.textContent =
      "Please choose a video.";

    return;
  }


  if (!file.type.startsWith("video/")) {

    status.textContent =
      "Please choose a video file.";

    return;
  }


  status.textContent =
    "⏳ Uploading your clip...";


  try {

    /* Create a unique file name */

    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const filePath =
      "uploads/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "-" +
      safeName;


    /* Upload video to Storage */

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("Clips")
        .upload(
          filePath,
          file
        );


    if (uploadError) {

      throw uploadError;

    }


    /* Save information in database */

    const { error: databaseError } =
      await supabaseClient
        .from("clips")
        .insert({

          title: title,

          category:
            category || "General",

          creator_name:
            creator || "J Extra Creator",

          file_path:
            filePath

        });


    if (databaseError) {

      throw databaseError;

    }


    status.textContent =
      "✅ Clip uploaded successfully!";


    /* Clear form */

    document.getElementById(
      "clipTitle"
    ).value = "";

    document.getElementById(
      "clipCategory"
    ).value = "";

    document.getElementById(
      "creatorName"
    ).value = "";

    fileInput.value = "";


    /* Refresh library */

    loadClips();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "❌ Upload failed: " +
      error.message;

  }

}


/* =========================================
   LOAD CLIPS
   ========================================= */

async function loadClips() {

  const container =
    document.getElementById(
      "clipsContainer"
    );


  container.innerHTML =
    "<p class='status'>⏳ Loading clips...</p>";


  const { data, error } =
    await supabaseClient
      .from("clips")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    container.innerHTML =
      "<p class='status'>❌ Unable to load clips.</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p class='status'>No clips uploaded yet.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(clip => {

    const publicURL =
      supabaseClient
        .storage
        .from("Clips")
        .getPublicUrl(
          clip.file_path
        )
        .data
        .publicUrl;


    const card =
      document.createElement("div");

    card.className =
      "clip-card";


    const title =
      escapeHTML(
        clip.title
      );

    const category =
      escapeHTML(
        clip.category || "General"
      );

    const creator =
      escapeHTML(
        clip.creator_name ||
        "J Extra Creator"
      );


    card.innerHTML = `

      <div class="clip-info">

        <h3>
          🎥 ${title}
        </h3>

        <p>
          Category: ${category}
        </p>

        <p>
          Creator: ${creator}
        </p>

      </div>

      <video
        controls
        preload="metadata"
        src="${publicURL}"
      ></video>

      <a
        class="download-btn"
        href="${publicURL}"
        download
      >
        ⬇️ Download Clip
      </a>

    `;


    container.appendChild(card);

  });

}


/* =========================================
   SECURITY
   ========================================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================================
   START
   ========================================= */

loadClips();

</script>

</body>
</html>
