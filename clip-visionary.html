<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clip Visionary - CREOVIX</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .clip-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
      margin-top: 25px;
      text-align: left;
    }

    .clip-card video {
      width: 100%;
      max-height: 400px;
      border-radius: 10px;
      background: #000;
      margin: 15px 0;
    }

    .clip-info h3 {
      margin-bottom: 8px;
    }

    .clip-info p {
      color: #aaa;
      margin-bottom: 10px;
    }

    .upload-box {
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 25px;
      margin-top: 20px;
    }

    .upload-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
    }

    .download-btn,
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      background: #00a86b;
      color: white;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .download-btn:hover,
    button:hover {
      opacity: 0.85;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
    }

    .login-warning {
      background: #221;
      border: 1px solid #665500;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>
</head>
