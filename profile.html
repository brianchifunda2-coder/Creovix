<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creator Profile - CREOVIX</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .profile-page {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .profile-card {
      background: #111;
      color: white;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      border: 1px solid #333;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      margin-bottom: 15px;
      background: #222;
    }

    .profile-card h1 {
      margin: 5px 0;
    }

    .profile-email {
      color: #aaa;
      margin-bottom: 25px;
    }

    .profile-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
    }

    .stat-label {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    .profile-section {
      text-align: left;
      margin-top: 25px;
    }

    .profile-section h3 {
      margin-bottom: 8px;
    }

    .profile-section p {
      color: #ccc;
      line-height: 1.6;
      word-break: break-word;
    }

    .profile-section a {
      color: white;
    }

    .edit-box {
      margin-top: 30px;
      text-align: left;
      border-top: 1px solid #333;
      padding-top: 25px;
    }

    .edit-box label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .edit-box input,
    .edit-box textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1b1b1b;
      color: white;
      font-size: 15px;
    }

    .edit-box textarea {
      min-height: 100px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .save-button:hover {
      opacity: 0.85;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: white;
      text-decoration: none;
    }

    @media (max-width: 650px) {
      .profile-info {
        grid-template-columns: 1fr;
      }

      .profile-page {
        margin: 20px auto;
        padding: 12px;
      }

      .profile-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">CREOVIX</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="script-creator.html">Scripts</a>
    <a href="movie-editing.html">Editing</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>
</header>

<main class="profile-page">

  <div class="profile-card">

    <img
      id="avatar"
      class="profile-avatar"
      src="https://via.placeholder.com/120"
      alt="Creator Profile"
    >

    <h1 id="displayName">Creator</h1>

    <div id="displayEmail" class="profile-email">
      Loading...
    </div>

    <div class="profile-info">

      <div class="stat">
        <div id="scriptCount" class="stat-number">0</div>
        <div class="stat-label">Scripts</div>
      </div>

      <div class="stat">
        <div id="clipCount" class="stat-number">0</div>
        <div class="stat-label">Clips</div>
      </div>

      <div class="stat">
        <div class="stat-number">$0.00</div>
        <div class="stat-label">Earnings</div>
      </div>

    </div>

    <div class="profile-section">
      <h3>About</h3>
      <p id="displayBio">
        Tell people about yourself and your creative journey.
      </p>
    </div>

    <div class="profile-section">
      <h3>Creative Skills</h3>
      <p id="displaySkills">
        Add your creative skills below.
      </p>
    </div>

    <div class="profile-section">
      <h3>Website / Social</h3>
      <p id="displayWebsite">
        No link added.
      </p>
    </div>

    <div class="edit-box">

      <h2>Edit Creator Profile</h2>

      <label for="creatorName">Creator Name</label>

      <input
        id="creatorName"
        type="text"
        placeholder="Your creator name"
      >

      <label for="bio">Bio</label>

      <textarea
        id="bio"
        placeholder="Tell people about yourself..."
      ></textarea>

      <label for="skills">Creative Skills</label>

      <input
        id="skills"
        type="text"
        placeholder="Music, Writing, Video Editing..."
      >

      <label for="website">Website / Social Link</label>

      <input
        id="website"
        type="url"
        placeholder="https://..."
      >

      <label for="avatarUrl">Profile Image URL</label>

      <input
        id="avatarUrl"
        type="url"
        placeholder="https://..."
      >

      <button id="saveProfile" class="save-button">
        Save Creator Profile
      </button>

      <div id="message" class="message"></div>

    </div>

    <a href="dashboard.html" class="back-link">
      ← Back to Dashboard
    </a>

  </div>

</main>

<script>

const SUPABASE_URL =
  "https://sxdfwbvjohzgfaatqxqk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Izxu9zWrYhf3rqEUDxInVQ_1qdGoJdQ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const avatar =
  document.getElementById("avatar");

const displayName =
  document.getElementById("displayName");

const displayEmail =
  document.getElementById("displayEmail");

const displayBio =
  document.getElementById("displayBio");

const displaySkills =
  document.getElementById("displaySkills");

const displayWebsite =
  document.getElementById("displayWebsite");

const creatorName =
  document.getElementById("creatorName");

const bio =
  document.getElementById("bio");

const skills =
  document.getElementById("skills");

const website =
  document.getElementById("website");

const avatarUrl =
  document.getElementById("avatarUrl");

const message =
  document.getElementById("message");


async function loadProfile() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    window.location.href =
      "login.html";

    return;
  }

  const user = session.user;

  const metadata =
    user.user_metadata || {};

  const name =
    metadata.creator_name ||
    user.email.split("@")[0];


  displayName.textContent =
    name;

  displayEmail.textContent =
    user.email;


  creatorName.value =
    metadata.creator_name || "";

  bio.value =
    metadata.bio || "";

  skills.value =
    metadata.skills || "";

  website.value =
    metadata.website || "";

  avatarUrl.value =
    metadata.avatar || "";


  displayBio.textContent =
    metadata.bio ||
    "Tell people about yourself and your creative journey.";


  displaySkills.textContent =
    metadata.skills ||
    "Add your creative skills below.";


  if (metadata.website) {

    displayWebsite.innerHTML =
      `<a href="${metadata.website}"
          target="_blank"
          rel="noopener noreferrer">
          ${metadata.website}
       </a>`;

  } else {

    displayWebsite.textContent =
      "No link added.";

  }


  if (metadata.avatar) {

    avatar.src =
      metadata.avatar;

  }


  await loadScriptCount(user.id);

}


async function loadScriptCount(userId) {

  const {
    count,
    error
  } = await supabaseClient
    .from("scripts")
    .select("*", {
      count: "exact",
      head: true
    })
    .eq("user_id", userId);


  if (!error) {

    document.getElementById(
      "scriptCount"
    ).textContent =
      count || 0;

  }

}


async function loadClipCount(userId) {

  /*
    Clips can be connected here when
    the clips table is fully configured.
  */

  document.getElementById(
    "clipCount"
  ).textContent = "0";

}


document
  .getElementById("saveProfile")
  .addEventListener(
    "click",
    async function () {

      message.textContent =
        "Saving...";


      const newName =
        creatorName.value.trim();

      const newBio =
        bio.value.trim();

      const newSkills =
        skills.value.trim();

      const newWebsite =
        website.value.trim();

      const newAvatar =
        avatarUrl.value.trim();


      const {
        error
      } =
        await supabaseClient.auth.updateUser({

          data: {

            creator_name:
              newName,

            bio:
              newBio,

            skills:
              newSkills,

            website:
              newWebsite,

            avatar:
              newAvatar

          }

        });


      if (error) {

        message.textContent =
          "❌ " + error.message;

        return;

      }


      displayName.textContent =
        newName || "Creator";


      displayBio.textContent =
        newBio ||
        "Tell people about yourself and your creative journey.";


      displaySkills.textContent =
        newSkills ||
        "Add your creative skills below.";


      if (newWebsite) {

        displayWebsite.innerHTML =
          `<a href="${newWebsite}"
              target="_blank"
              rel="noopener noreferrer">
              ${newWebsite}
           </a>`;

      } else {

        displayWebsite.textContent =
          "No link added.";

      }


      if (newAvatar) {

        avatar.src =
          newAvatar;

      } else {

        avatar.src =
          "https://via.placeholder.com/120";

      }


      message.textContent =
        "✓ Creator profile saved successfully!";

    }
  );


async function startProfile() {

  await loadProfile();

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    await loadClipCount(session.user.id);
  }

}


startProfile();

</script>

</body>
</html>
